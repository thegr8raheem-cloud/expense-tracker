<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Expense Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://unpkg.com/tabulator-tables@5.6.1/dist/css/tabulator.min.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/tabulator-tables@5.6.1/dist/js/tabulator.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <header class="app-header">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
        <div class="flex items-center gap-3">
          <div class="logo" aria-hidden="true">💸</div>
          <div>
            <h1>Expense Tracker</h1>
            <p>Track what you spend and see where it goes.</p>
          </div>
        </div>
        <div class="lg:hidden">
          <button onclick="openSidebar()" class="btn btn-ghost" aria-label="Open spending summary">
            📊 Summary
          </button>
        </div>
      </div>
    </header>

    <!-- MOBILE SUMMARY DRAWER -->
    <div id="sidebarOverlay" onclick="closeSidebar()"></div>
    <div id="mobileSidebar">
      <div class="flex items-center justify-between">
        <h2>Spending by category</h2>
        <button onclick="closeSidebar()" class="close-btn" aria-label="Close summary">&times;</button>
      </div>
      <ul id="categoryTotalsMobile"></ul>
    </div>

    <main class="mx-auto grid max-w-6xl gap-6 px-4 py-6 lg:grid-cols-[minmax(0,1fr)_320px]">
      <div class="min-w-0 space-y-6">
        <!-- ADD EXPENSE -->
        <section class="card" aria-labelledby="addHeading">
          <div class="card-head">
            <h2 id="addHeading">Add an expense</h2>
            <p class="sub">Pick a category below or type your own.</p>
          </div>

          <div class="chips" aria-label="Quick categories">
            <button type="button" class="chip" data-v="Food">🍽️ Food</button>
            <button type="button" class="chip" data-v="Transport">🚌 Transport</button>
            <button type="button" class="chip" data-v="Shopping">🛍️ Shopping</button>
            <button type="button" class="chip" data-v="Bills">🧾 Bills</button>
            <button type="button" class="chip" data-v="Entertainment">🎬 Entertainment</button>
            <button type="button" class="chip" data-v="Health">💊 Health</button>
          </div>

          <div class="grid gap-4 sm:grid-cols-2">
            <label class="field sm:col-span-2">
              <span>What did you spend on?</span>
              <input id="title" name="title" placeholder="e.g. Lunch with friends" />
            </label>

            <label class="field">
              <span>Amount</span>
              <input id="amount" type="number" name="amount" placeholder="0" />
            </label>

            <label class="field">
              <span>Date</span>
              <input type="date" id="date" name="date" onclick="this.showPicker()" />
            </label>

            <label class="field">
              <span>Category</span>
              <input id="category" name="categories" list="categories" placeholder="e.g. Food" />
            </label>
            <datalist id="categories">
              <option value="Food"></option>
              <option value="Transport"></option>
              <option value="Shopping"></option>
              <option value="Bills"></option>
              <option value="Entertainment"></option>
              <option value="Health"></option>
            </datalist>

            <label class="field">
              <span>Paid with</span>
              <input id="payment_method" name="payment_method" list="pay_methods" placeholder="e.g. Card" />
            </label>
            <datalist id="pay_methods">
              <option value="Cash"></option>
              <option value="Online"></option>
              <option value="Card"></option>
              <option value="Other"></option>
            </datalist>

            <button onclick="addExpense()" class="btn btn-primary sm:col-span-2">Add expense</button>
          </div>
        </section>

        <!-- TEAM ZONE: filter bar goes here (above the table) -->
        <!-- TEAM ZONE: charts and budget bar go here -->

        <!-- EXPENSES TABLE -->
        <section class="card" aria-labelledby="listHeading">
          <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 id="listHeading">Your expenses</h2>
              <p class="sub">Click a column title to sort.</p>
            </div>
            <button onclick="downloadExcel()" class="btn btn-ghost">⬇ Download Excel</button>
          </div>
          <div class="table-wrap">
            <div id="expenseTable"></div>
          </div>
        </section>
      </div>

      <!-- DESKTOP SUMMARY -->
      <aside id="categorySidebar" class="hidden lg:block">
        <div class="card sticky-card">
          <h2>Spending by category</h2>
          <ul id="categoryTotals"></ul>
        </div>
      </aside>
    </main>

    <!-- EDIT MODAL -->
    <div
      id="editModal"
      class="fixed inset-0 backdrop-blur-xs bg-black/50 bg-opacity-[0.3] hidden flex items-center justify-center z-[60] p-4"
    >
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="editHeading">
        <h2 id="editHeading">Edit expense</h2>
        <div class="grid gap-4 sm:grid-cols-2">
          <label class="field sm:col-span-2">
            <span>Title</span>
            <input id="edit_title" placeholder="Title" />
          </label>
          <label class="field">
            <span>Category</span>
            <input id="edit_category" placeholder="Category" />
          </label>
          <label class="field">
            <span>Paid with</span>
            <input id="edit_payment" placeholder="Payment method" />
          </label>
          <label class="field">
            <span>Amount</span>
            <input id="edit_amount" type="number" placeholder="Amount" />
          </label>
          <label class="field">
            <span>Date</span>
            <input id="edit_date" type="date" />
          </label>
        </div>
        <div class="mt-6 flex justify-end gap-3">
          <button onclick="closeModal()" class="btn btn-ghost">Cancel</button>
          <button onclick="updateExpense()" class="btn btn-primary">Save changes</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>
    <!-- TEAM: add your own <script> tag below this line (for example charts.js) -->

    <script>
      // Category chips fill the category box; the date starts as today (local time).
      document.querySelectorAll(".chip").forEach(function (chip) {
        chip.addEventListener("click", function () {
          document.getElementById("category").value = chip.dataset.v;
        });
      });
      var dateInput = document.getElementById("date");
      if (!dateInput.value) {
        dateInput.value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000)
          .toISOString()
          .slice(0, 10);
      }
    </script>
  </body>
</html>
